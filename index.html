<!DOCTYPE html>
<html lang="ja">
<head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DeepSeek-R1-Distill-Qwen-1.5B - 肩書き重視版</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:800px;margin:2rem auto;padding:0 1rem;background:#0f172a;color:#e2e8f0}
  h1{font-size:1.3rem;color:#38bdf8}
  .badge{display:inline-block;background:#38bdf8;color:#0f172a;padding:.2rem .6rem;border-radius:12px;font-size:.75rem;font-weight:700;margin-left:.5rem}
  .status{font-size:.85rem;color:#94a3b8;margin-bottom:.8rem;white-space:pre-wrap;word-break:break-all}
  .chat-box{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:1rem;height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:.5rem;margin-bottom:1rem}
  .message{padding:.6rem .9rem;border-radius:12px;max-width:85%;line-height:1.6;white-space:pre-wrap}
  .user{background:#38bdf8;color:#0f172a;align-self:flex-end}
  .assistant{background:#334155;align-self:flex-start}
  .input-area{display:flex;gap:.5rem}
  .input-area input{flex:1;padding:.6rem 1rem;border:1px solid #334155;background:#1e293b;color:#fff;border-radius:20px}
  .input-area button{padding:.6rem 1.4rem;background:#38bdf8;color:#0f172a;border:none;border-radius:20px;font-weight:700}
  .input-area button:disabled{opacity:.5}
  .progress{height:6px;background:#1e293b;border-radius:3px;overflow:hidden;margin-bottom:1rem}
  .progress-bar{height:100%;width:0%;background:#38bdf8;transition:width .2s}
</style>
<script type="importmap">
{
  "imports": {
    "@mlc-ai/web-llm": "https://esm.run/@mlc-ai/web-llm@0.2.84"
  }
}
</script>
</head>
<body>
<h1>DeepSeek-R1-Distill-Qwen-1.5B <span class="badge">MLC / WebLLM</span></h1>
<div class="status" id="status">初期化中...</div>
<div class="progress"><div class="progress-bar" id="progressBar"></div></div>
<div class="chat-box" id="chatBox">
  <div class="message assistant">DeepSeek-R1-Distill-Qwen-1.5B (公式MLC) を読み込みます。肩書きはDeepSeek、推論精度は一旦置いておくバージョンです。</div>
</div>
<div class="input-area">
  <input id="userInput" disabled placeholder="こんにちは" />
  <button id="sendBtn" disabled>送信</button>
</div>

<script type="module">
import { CreateMLCEngine, prebuiltAppConfig } from "@mlc-ai/web-llm";

const statusEl = document.getElementById("status");
const progressBar = document.getElementById("progressBar");
const chatBox = document.getElementById("chatBox");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");

// 公式MLCの1.5B - mlc.ai/modelsには存在するが prebuiltには未収録のやつ
const MODEL_ID = "DeepSeek-R1-Distill-Qwen-1.5B-q4f32_1-MLC";

// 重要: v0_2_84 のランタイムには v0_2_84 のwasmを当てる
// Qwen2 1.5BのwasmはDeepSeek 1.5Bと互換 (公式でもそう案内されている)
const customRecord = {
  model: "https://huggingface.co/mlc-ai/DeepSeek-R1-Distill-Qwen-1.5B-q4f32_1-MLC/resolve/main/",
  model_id: MODEL_ID,
  model_lib: "https://raw.githubusercontent.com/mlc-ai/binary-mlc-llm-libs/main/web-llm-models/v0_2_84/Qwen2-1.5B-Instruct-q4f32_1-ctx4k_cs1k-webgpu.wasm",
  vram_required_MB: 2500,
};

const appConfig = {
  ...prebuiltAppConfig,
  model_list: [customRecord, ...prebuiltAppConfig.model_list]
};

const initProgressCallback = (p) => {
  statusEl.textContent = `[${Math.round((p.progress||0)*100)}%] ${p.text}`;
  if (p.progress) progressBar.style.width = `${Math.round(p.progress*100)}%`;
};

let engine;
async function init() {
  try {
    if (!navigator.gpu) throw new Error("WebGPU非対応");
    engine = await CreateMLCEngine(MODEL_ID, { appConfig, initProgressCallback });
    statusEl.textContent = "✅ DeepSeek-R1-Distill-Qwen-1.5B 準備完了 (推論精度はβ)";
    userInput.disabled = false; sendBtn.disabled = false;
  } catch (e) {
    console.error(e);
    statusEl.textContent = `❌ ${e.message}`;
  }
}

function append(role, text) {
  const d = document.createElement("div");
  d.className = `message ${role}`;
  d.textContent = text;
  chatBox.appendChild(d);
  chatBox.scrollTop = chatBox.scrollHeight;
  return d;
}

async function send() {
  const t = userInput.value.trim();
  if (!t || !engine) return;
  userInput.value = "";
  userInput.disabled = true; sendBtn.disabled = true;
  append("user", t);
  const a = append("assistant", "");
  let full = "";
  try {
    // DeepSeekは<think>を吐くので、thinkタグを除去して表示する
    const chunks = await engine.chat.completions.create({
      messages: [
        { role: "system", content: "You are DeepSeek-R1-Distill-Qwen-1.5B. Answer in Japanese. Do not output <think> tags, just give final answer." },
        { role: "user", content: t }
      ],
      stream: true,
      temperature: 0.6
    });
    for await (const c of chunks) {
      full += c.choices[0]?.delta?.content || "";
      // <think>...</think> が混ざったら除去
      let display = full.replace(/<think>[\s\S]*?<\/think>/g, "").replace(/<think>[\s\S]*/g, "");
      if (!display.trim()) display = full; // まだthink中ならそのまま
      a.textContent = display;
      chatBox.scrollTop = chatBox.scrollHeight;
    }
  } catch (e) {
    a.textContent = `エラー: ${e.message}`;
  } finally {
    userInput.disabled = false; sendBtn.disabled = false; userInput.focus();
  }
}

sendBtn.onclick = send;
userInput.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); send(); } };

init();
</script>

ment(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script></body>
</html>
